name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/agent-simulator/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build PWA and generate offline packages
        run: |
          cd web/agent-simulator
          npm ci
          npm run build
          cd ../..
          chmod +x scripts/build-offline-package.sh
          ./scripts/build-offline-package.sh

      - name: Deploy to Firebase Hosting (Service Account)
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSELAB_ROBOTICA_EDU != '' }}"
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSELAB_ROBOTICA_EDU }}"
          channelId: live
          projectId: pulselab-robotica-edu

      - name: Deploy to Firebase Hosting (CI Token fallback)
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSELAB_ROBOTICA_EDU == '' && secrets.FIREBASE_TOKEN != '' }}"
        run: |
          npx -y firebase-tools@latest deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"

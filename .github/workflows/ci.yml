name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/student-pwa/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # alunos/ não é versionado: o build vem antes das checagens que empacotam a PWA
      - name: PWA unit tests and build
        run: |
          cd apps/student-pwa
          npm ci
          npm run build
          npm run test:unit

      - name: Version consistency
        run: python3 tooling/release/check-version-consistency.py

      - name: Python tests
        run: python3 -m unittest discover -s tests/python -p 'test_*.py'

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.ps1 -File | Where-Object { $_.FullName -notmatch 'node_modules' } | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message) (linha $($errors[0].Extent.StartLineNumber))"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: PowerShell update and identity tests
        shell: pwsh
        run: ./tests/powershell/test-launcher-update.ps1


  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/student-pwa/package-lock.json

      - name: Playwright (Chromium)
        run: |
          cd apps/student-pwa
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Migrations and RLS tests (disposable Postgres container)
        run: python3 tests/check-database.py
